# Optional "Blueprint" for Render.com: New + -> Blueprint -> pick this repo. Or create the service by hand (see GO-LIVE-PLAYGROUND.md).
services:
  - type: web
    name: sf-skode-api
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node scripts/api-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_ALLOWED_ORIGINS
        value: https://sanjay-kumar-b.github.io
      - key: SF_SESSION_SECRET
        generateValue: true
      - key: SF_CLIENT_SECRET
        sync: false
