
# Builds the site and publishes it to GitHub Pages every time you push to `main`.
# One-time setup in your repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Settings -> Secrets and variables -> Actions -> Variables tab:
#   PUBLIC_SF_API_URL  = https://your-api.onrender.com     (the Playground API, no trailing slash)
#   SITE_URL           = https://sfskode.github.io  (optional: this is the default below)

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v5

      # Setup Node.js 24
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Install dependencies
      - run: npm ci

      # Build the site
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sfskode.github.io' }}
          PUBLIC_SF_API_URL: ${{ vars.PUBLIC_SF_API_URL }}
          PUBLIC_SF_PACKAGE_ID: ${{ vars.PUBLIC_SF_PACKAGE_ID }}

      # Upload build output for GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy to GitHub Pages
      - id: deployment
        uses: actions/deploy-pages@v4
